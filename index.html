        .panel {
            background: rgba(30, 30, 30, 0.5);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            color: reed;
            text-align: center;
            width: 300px;
            transition: all 0.3s ease;
        }
        .option {
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .toggle {
            width: 40px;
            height: 20px;
            background: #666;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .toggle::before {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            top: 1px;
            left: 2px;
            transition: left 0.3s ease;
        }
        .toggle.active {
            background: #0ff;
        }
        .toggle.active::before {
            left: 20px;
        }
        .slider {
            width: 100%;
            transition: all 0.3s ease;
        }
        .circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .fps-counter {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 16px;
            color: white;
            font-family: 'Arial', sans-serif;
            transition: all 0.3s ease;
        }
        .fps-counter span {
            font-weight: bold;
        }
        .color-picker {
            width: 100%;
            margin-top: 10px;
        }

// Função para adicionar listeners de eventos
function addEventListeners() {
    canvas.addEventListener('touchstart', handleTouchStart);
    canvas.addEventListener('touchmove', handleTouchMove);
    canvas.addEventListener('touchend', handleTouchEnd);
}

// Função para lidar com eventos de toque
function handleTouchStart(event) {
    console.log("Toque iniciado...");
    const touch = event.touches[0];
    const rect = canvas.getBoundingClientRect();
    const x = touch.clientX - rect.left;
    const y = touch.clientY - rect.top;

    // Simula disparo de tiro
    simulateShot(x, y);
}

function handleTouchMove(event) {
    console.log("Toque em movimento...");
    // Simula ajuste da mira
    adjustAim(event.touches[0].clientX, event.touches[0].clientY);
}

function handleTouchEnd(event) {
    console.log("Toque finalizado...");
    // Simula disparo de tiro ao soltar o toque
    simulateShot(event.changedTouches[0].clientX, event.changedTouches[0].clientY);
}

// Função para simular disparo de tiro
function simulateShot(x, y) {
    console.log(`Disparando tiro em (${x}, ${y})...`);
    const target = detectTarget(x, y);
    if (target) {
        console.log(`Acertou o alvo ${target.id}!`);
        score += 100;
    } else {
        console.log("tiro aceito.");
    }
}

// Função para detectar alvo
function detectTarget(x, y) {
    for (let target of targets) {
        const distance = Math.sqrt(Math.pow(x - target.position.x, 2) + Math.pow(y - target.position.y, 2));
        if (distance <= target.radius) {
            return target;
        }
    }
    return null;
}
